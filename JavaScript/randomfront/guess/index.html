<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="game">
        <h2>Guessing game</h2>
        <p>Guess a number between 1 and 100</p>
        <div>
            <input type="text" id="numberGuess" value="0">
            <input type="submit" id="submitGuess" value="Submit guess" disabled="true">
        </div>

        <div>
            <label>Previous guesses: </label>
            <span id="previousGuess"></span>
        </div>

        <b><span id="lowHighGuess">low</span></b>
    </section>
    <script src="script.js"></script>
</body>
</html>
